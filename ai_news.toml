# AI 资讯雷达 · 数据来源和素材配置。改完提交到仓库，下次运行就会生效。
# 每个来源都可以用 enabled = false 关掉。给 GPT 的写作说明在 ai_news_guide.md 里。

[fetch]
lookback_hours = 48   # 只收最近多少小时内发布的内容（留出余量，覆盖定时任务的延迟和周末）

[digest]              # 每天给 GPT 读的素材
cooldown_days = 7     # 前几天的素材里出现过的内容，多少天内不再放
max_hot_topics = 10   # 「多个来源同时提到的话题」最多几个
max_hot_single = 8    # 「只在一个地方出现、但很热的讨论」最多几条
max_x = 10            # 「X 上互动最多的帖子」最多几条
max_per_section = 10  # 新东西里每一小类最多几条
max_papers = 12       # 论文最多几篇

# ---------------------------------------------------------------- 论文

[hf_papers]           # Hugging Face 每日精选论文，带点赞数（热度信号）
enabled = true

[arxiv]               # arXiv 当天全部新论文（官方 RSS），一天 1500 多篇
# 不调用模型就没法逐篇判断，所以先关掉，论文用上面的 HF 每日论文（社区投票精选）。
# ai-news-brief 等项目也是这样做的。以后接上能用的模型再打开。
enabled = false
categories = ["cs.AI", "cs.CL", "cs.LG"]   # 想看计算机视觉就加 "cs.CV"

# ---------------------------------------------------------------- 社区

[hackernews]
enabled = true
min_points = 50       # 至少多少分的帖子
ai_only = true        # 只要标题里带下面关键词的
# 4 个字母以内的按整词匹配（AI 不会匹配到 said），更长的按包含匹配。宁可多收，后面还有筛选
keywords = [
  "AI", "AGI", "LLM", "GPT", "RAG", "MCP", "RLHF",
  "Claude", "Gemini", "OpenAI", "Anthropic", "DeepMind", "DeepSeek", "Qwen", "Llama", "Mistral", "Grok", "xAI",
  "Hugging Face", "Copilot", "Cursor", "ChatGPT", "chatbot",
  "language model", "machine learning", "deep learning", "neural", "transformer", "diffusion",
  "agent", "agentic", "fine-tun", "inference", "embedding", "reasoning", "benchmark", "open-weight", "open weights",
  "GPU", "CUDA", "NVIDIA",
]

# ---------------------------------------------------------------- 新模型

[openrouter]          # 新模型通常最先在这里上线
enabled = true

# ---------------------------------------------------------------- 油管
# 填频道的 @handle（频道网址 youtube.com/@xxx 里的那段），或者 UC 开头的频道 ID
# 日报里不单独列视频，只用来判断「大家都在讨论什么」（同一件事有几个来源在说）

[youtube]
enabled = true
lookback_hours = 72   # 油管更新慢一些，看最近 3 天
channels = [
  "@AndrejKarpathy",
  "@TwoMinutePapers",
  "@YannicKilcher",
  "@aiexplained-official",
  "@DwarkeshPatel",
  "@MachineLearningStreetTalk",
  "@LatentSpacePod",
  "@GoogleDeepMind",
  "@OpenAI",
  "@anthropic-ai",
]

# ---------------------------------------------------------------- X（推特）
# X 没有免费接口，GitHub 的服务器也上不了 X。所以这部分由你自己电脑上的 DeepSeek 用 ego 浏览器去看
# （任务说明在 x_task.md），看完把帖子存到 data/x/日期/ 推到仓库，这里只读这些文件。设置方法见 README。
# 下面的 lists、accounts、searches 是给 DeepSeek 看的：想看哪些页面就改这里

[x]
enabled = true
lookback_hours = 48   # 只用最近多少小时内发的帖子
min_likes = 10        # 点赞少于这个数的不放进素材
# 最省事的办法：在 X 上建一个列表（List），把想看的账号都加进去，把列表网址填在这里。
# 填了列表，DeepSeek 就只看列表，不再一个个打开下面的账号：快很多，花的 token 少，也不容易被 X 限流
lists = []            # 例如 ["https://x.com/i/lists/1234567890"]
accounts = [
  # 官方
  "OpenAI", "AnthropicAI", "GoogleDeepMind", "AIatMeta", "MistralAI", "xai",
  "deepseek_ai", "Alibaba_Qwen", "Kimi_Moonshot", "huggingface", "OpenRouterAI", "cursor_ai",
  # 研究者和工程师
  "karpathy", "sama", "demishassabis", "ylecun", "AndrewYNg", "JeffDean", "OfficialLoganK", "DrJimFan",
  "ClementDelangue", "simonw", "swyx", "natolambert", "rasbt", "emollick",
  # 论文、榜单和爆料
  "_akhaliq", "omarsar0", "lmarena_ai", "ArtificialAnlys", "testingcatalog",
  # 中文
  "dotey", "op7418",
]
# X 搜索，写法和 X 搜索框一样（min_faves 是至少多少赞）。DeepSeek 会自动加上 since:昨天的日期
searches = [
  '(LLM OR "AI model" OR "open source model" OR "open weights") min_faves:1000 -filter:replies',
  '(大模型 OR 开源模型 OR 智能体 OR AI) lang:zh min_faves:300 -filter:replies',
]

# ---------------------------------------------------------------- 博客和 Newsletter（RSS）
# url 可以写一个地址，也可以写多个（前一个失败就用下一个）
# kind：official 是官方发布（放进「新东西」），newsletter 是个人博客和 Newsletter，media 是媒体
