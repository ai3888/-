# 第二大脑配置。改完提交到仓库，下次运行就会生效。

store = "memory"        # 记忆库放在哪个文件夹（相对这个文件）
language = "简体中文"    # 摘要、分支名、「关于我」用什么语言写

# 分支的大类尽量从这里选，都不合适时 GPT 会新建。
# 改完想把所有对话重新归类：python memory.py organize --redo
suggested_branches = ["工作", "编程", "AI 工具", "投资理财", "学习", "健康", "生活", "创作"]
max_depth = 2           # 分支最多几层，比如「编程/Python」

[llm]
# 和项目雷达一样，用环境变量 OPENAI_API_KEY、OPENAI_BASE_URL、OPENAI_MODEL 配置。
# 兼容 OpenAI 接口的服务都能用（中转、国内模型），把 OPENAI_BASE_URL 和 OPENAI_MODEL 换成它的就行。
model = "gpt-4o-mini"   # 没设置 OPENAI_MODEL 时用这个
conversation_chars = 8000   # 每段对话最多给 GPT 看多少字，太长的取开头和结尾
workers = 4             # 同时整理几段，遇到限流可以改小
max_per_run = 300       # 每次最多整理多少段，剩下的下次接着整理
max_minutes = 30        # 每次最多整理多久
branch_entries = 40     # 写分支总结时看最近多少段对话

[context]
max_chars = 12000       # context 命令最多输出多少字
