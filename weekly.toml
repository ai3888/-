# 每周素材包配置。用法见 README「每周素材包」一节。
# 路径可以用 ~ 表示你的用户目录；写相对路径时，从这个仓库的文件夹算起。

days = 7            # 默认打包最近几天（包括今天）
max_chars = 40000   # 素材最多多少字（不算写作说明）。超了会自动压缩：先缩短 AI 的回答，再缩短我的消息，最后把小对话折叠成一行
                    # 中文大约 1 个字 1 个 token。用的 AI 一次读不完，就把这个数调小

# ---------------------------------------------------------------- 1. 从哪里收集
[sources]
inbox = "weekly/inbox"               # 放 ChatGPT / Claude / DeepSeek 的导出（zip 或 json）、复制下来的聊天记录（txt / md）
notes = "weekly/notes.md"            # 随手记，用 python3 weekly.py note "内容" 添加
claude_code = "~/.claude/projects"   # Claude Code 的本地记录，自动读取；没用过就自动跳过
codex = "~/.codex/sessions"          # Codex CLI 的本地记录，同上

# ---------------------------------------------------------------- 2. 代码提交
[git]
auto = true    # Claude Code / Codex 在哪个项目文件夹里干过活，就顺便读那个项目这几天的提交记录
repos = []     # 再加几个项目文件夹，例如 ["~/code/my-app", "D:/projects/小程序"]
author = ""    # 只看某个人的提交（填 git 里的名字或邮箱）。留空就看全部，机器人的提交总是跳过

# ---------------------------------------------------------------- 3. 给对话打标记，提醒 AI 重点看
[signals]
# 我的消息里有几条出现这些词，就标「可能卡住了」（不区分大小写）
stuck_words = ["报错", "错误", "不行", "没用", "失败", "不对", "没反应", "怎么回事", "为什么还", "卡住", "崩了", "搞不定",
               "error", "failed", "not working", "traceback", "exception"]
stuck_min = 3
long_min = 15   # 我在一个对话里发了这么多条消息，就标「聊了很久」
