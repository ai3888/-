name: 每日 AI 雷达

# 每天早上先跑 GitHub 项目雷达，再生成 AI 日报素材（reports/ai-news/latest.md），
# ChatGPT 的定时任务 8 点读素材写日报。
on:
  schedule:
    - cron: "37 22 * * *"  # 每天 UTC 22:37，即北京时间 06:37。GitHub 定时任务有时会晚几十分钟，留足余量
  workflow_dispatch:        # 允许在 Actions 页面手动点「Run workflow」

permissions:
  contents: write   # 提交报告
  issues: write     # config.toml 里 create_issue = true 时开 issue

concurrency:
  group: radar

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: GitHub 项目雷达
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: python scout.py

      - name: 生成 AI 日报素材
        if: ${{ !cancelled() }}   # 项目雷达出错也照样生成素材
        run: python ai_news.py

      - name: 提交报告
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports data
          if git diff --cached --quiet; then
            echo "没有变化"
            exit 0
          fi
          git commit -m "daily: $(TZ=Asia/Shanghai date +%F) 项目雷达和 AI 日报素材"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
